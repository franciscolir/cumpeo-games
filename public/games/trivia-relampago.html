<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Relámpago - CUMPEO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/games/_shared/game-sdk.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .shake { animation: shake 0.5s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <div id="game-app" class="container mx-auto px-4 py-8 max-w-7xl grid grid-cols-1 lg:grid-cols-10 gap-6">

    <!-- Game Area 80% -->
    <section class="lg:col-span-8 space-y-6">
      <!-- Header -->
      <div class="text-center">
        <h1 class="text-4xl font-bold text-yellow-400 mb-2">⚡ TRIVIA RELÁMPAGO ⚡</h1>
      </div>

      <!-- Question -->
      <div id="question-container" class="bg-gray-800 rounded-2xl p-8 border-2 border-gray-700">
        <h2 id="question-text" class="text-2xl font-bold text-center mb-6">¿Cargando pregunta...</h2>

        <div id="answers-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <button onclick="selectAnswer(0)" class="answer-btn bg-gray-700 hover:bg-blue-600 p-4 rounded-xl text-left text-lg transition-all border-2 border-transparent hover:border-blue-400">
            <span class="font-bold text-yellow-400">A)</span> <span id="answer-0">-</span>
          </button>
          <button onclick="selectAnswer(1)" class="answer-btn bg-gray-700 hover:bg-blue-600 p-4 rounded-xl text-left text-lg transition-all border-2 border-transparent hover:border-blue-400">
            <span class="font-bold text-yellow-400">B)</span> <span id="answer-1">-</span>
          </button>
          <button onclick="selectAnswer(2)" class="answer-btn bg-gray-700 hover:bg-blue-600 p-4 rounded-xl text-left text-lg transition-all border-2 border-transparent hover:border-blue-400">
            <span class="font-bold text-yellow-400">C)</span> <span id="answer-2">-</span>
          </button>
          <button onclick="selectAnswer(3)" class="answer-btn bg-gray-700 hover:bg-blue-600 p-4 rounded-xl text-left text-lg transition-all border-2 border-transparent hover:border-blue-400">
            <span class="font-bold text-yellow-400">D)</span> <span id="answer-3">-</span>
          </button>
        </div>
      </div>

      <!-- Result feedback -->
      <div id="result-container" class="hidden text-center">
        <div id="result-box" class="inline-block px-8 py-4 rounded-2xl text-2xl font-bold">
          ¡Correcto! +50 pts
        </div>
      </div>

      <!-- Status messages -->
      <div id="status-message" class="text-center text-gray-500 text-lg">
        Esperando inicio del juego...
      </div>
    </section>

    <!-- Conductor Panel 20% -->
    <aside class="lg:col-span-2 bg-gray-800 rounded-2xl border-2 border-gray-700 p-4 space-y-4">
      <h3 class="font-bold text-yellow-300 text-lg text-center">Mando del Conductor</h3>
      <div class="text-xs text-gray-400 text-center">Mecánica: Responde rápido, acierta y suma puntos.</div>
      <div class="flex flex-col gap-2">
        <button id="btn-veredicto-acierto" class="w-full bg-green-600 hover:bg-green-500 py-2 rounded-xl font-bold">ACIERTA +50</button>
        <button id="btn-veredicto-fallo" class="w-full bg-red-600 hover:bg-red-500 py-2 rounded-xl font-bold">FALLO</button>
        <button id="btn-siguiente" class="w-full bg-gray-700 hover:bg-gray-600 py-2 rounded-xl font-bold">SIGUIENTE</button>
        <button id="btn-finalizar" class="w-full bg-gray-900 hover:bg-black py-2 rounded-xl font-bold">FINALIZAR</button>
      </div>
      <div class="text-[10px] text-gray-500 text-center">Puntaje gestionado por consola</div>
    </aside>

  </div>

  <script>
    // ==================== GAME STATE ====================
    const sdk = new GameSDK();
    let localScores = { A: 0, B: 0 };
    let currentQuestion = 0;
    let isPaused = false;
    let selectedTeam = 'A';

    // Sample questions (in real game, these would come from a database)
    const questions = [
      {
        text: "¿Cuál es la capital de Chile?",
        answers: ["Santiago", "Buenos Aires", "Lima", "Bogotá"],
        correct: 0
      },
      {
        text: "¿Quién pintó la Mona Lisa?",
        answers: ["Picasso", "Da Vinci", "Van Gogh", "Monet"],
        correct: 1
      },
      {
        text: "¿Cuántos días tiene un año bisiesto?",
        answers: ["364", "365", "366", "367"],
        correct: 2
      },
      {
        text: "¿Cuál es el planeta más grande del sistema solar?",
        answers: ["Saturno", "Júpiter", "Neptuno", "Urano"],
        correct: 1
      },
      {
        text: "¿En qué año llegó el hombre a la Luna?",
        answers: ["1967", "1968", "1969", "1970"],
        correct: 2
      }
    ];

    // ==================== SDK INITIALIZATION ====================
    sdk.init((sessionData) => {
      console.log('Session data received:', sessionData);
      // Team names and scores are managed by console
      if (sessionData.teams) {
        const teamA = sessionData.teams.find(t => t.letter === 'A');
        const teamB = sessionData.teams.find(t => t.letter === 'B');
        if (teamA) localScores.A = teamA.cumulativeScore || 0;
        if (teamB) localScores.B = teamB.cumulativeScore || 0;
      }
      loadQuestion();
    });

    sdk.onPause(() => {
      isPaused = true;
      document.getElementById('status-message').textContent = '⏸ PAUSA';
      document.getElementById('status-message').classList.add('text-yellow-400');
    });

    sdk.onResume(() => {
      isPaused = false;
      document.getElementById('status-message').textContent = '';
      document.getElementById('status-message').classList.remove('text-yellow-400');
    });

    sdk.onNextRound(() => {
      nextQuestion();
    });

    // ==================== GAME LOGIC ====================
    function loadQuestion() {
      if (currentQuestion >= questions.length) {
        endGame();
        return;
      }

      const q = questions[currentQuestion];
      document.getElementById('question-text').textContent = q.text;
      document.getElementById('answer-0').textContent = q.answers[0];
      document.getElementById('answer-1').textContent = q.answers[1];
      document.getElementById('answer-2').textContent = q.answers[2];
      document.getElementById('answer-3').textContent = q.answers[3];

      // Reset buttons
      document.querySelectorAll('.answer-btn').forEach(btn => {
        btn.classList.remove('bg-green-600', 'bg-red-600', 'border-green-400', 'border-red-400');
        btn.classList.add('bg-gray-700');
        btn.disabled = false;
      });

      // Hide result
      document.getElementById('result-container').classList.add('hidden');

      // Update SDK round
      sdk.updateRound(currentQuestion + 1, questions.length);
    }

    function selectAnswer(index) {
      if (isPaused) return;

      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll('.answer-btn');
      const isCorrect = index === q.correct;

      // Disable all buttons
      buttons.forEach(btn => btn.disabled = true);

      // Highlight correct answer
      buttons[q.correct].classList.remove('bg-gray-700');
      buttons[q.correct].classList.add('bg-green-600', 'border-green-400');

      // Show result
      const resultContainer = document.getElementById('result-container');
      const resultBox = document.getElementById('result-box');

      if (isCorrect) {
        // Add points to current team
        localScores[selectedTeam] += 50;
        sdk.updateScore(localScores);

        resultBox.textContent = `¡Correcto! +50 pts`;
        resultBox.className = 'inline-block px-8 py-4 rounded-2xl text-2xl font-bold bg-green-600';
      } else {
        buttons[index].classList.remove('bg-gray-700');
        buttons[index].classList.add('bg-red-600', 'border-red-400');

        resultBox.textContent = `Incorrecto! La respuesta era: ${q.answers[q.correct]}`;
        resultBox.className = 'inline-block px-8 py-4 rounded-2xl text-2xl font-bold bg-red-600';
      }

      resultContainer.classList.remove('hidden');

      // Next question after delay
      setTimeout(() => {
        currentQuestion++;
        loadQuestion();
      }, 2000);
    }

    function nextQuestion() {
      currentQuestion++;
      loadQuestion();
    }



    function endGame() {
      const winner = localScores.A > localScores.B ? 'A' :
                     localScores.B > localScores.A ? 'B' : null;

      document.getElementById('question-container').innerHTML = `
        <div class="text-center py-8">
          <h2 class="text-3xl font-bold text-yellow-400 mb-4">🏆 ¡JUEGO TERMINADO! 🏆</h2>
          <p class="text-xl mb-2">Finalizado</p>
        </div>
      `;

      document.getElementById('result-container').classList.add('hidden');
      document.getElementById('status-message').textContent = '';

      // Send game over to console
      sdk.gameOver({
        winner: winner,
        localScores: localScores,
        stats: {
          totalQuestions: questions.length,
          finalScoreA: localScores.A,
          finalScoreB: localScores.B
        }
      });
    }

    // Team selection (for demo, toggle with spacebar)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        selectedTeam = selectedTeam === 'A' ? 'B' : 'A';
        document.getElementById('status-message').textContent = `Turno: ${selectedTeam}`;
      }
    });
  </script>

</body>
</html>
