<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pictionary - CUMPEO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="../_shared/game-styles.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-surface">

  <!-- MODALES -->
  <div id="start-modal" class="hidden"></div>
  <div id="pause-modal" class="hidden"></div>
  <div id="turn-modal" class="hidden"></div>
  <div id="end-modal" class="hidden"></div>
  <div id="results-modal" class="hidden"></div>

  <div class="game-layout">

    <!-- AREA DE JUEGO (8 columnas) -->
    <section id="game-area" class="game-area">
      
      <!-- RELOJ -->
      <div id="clock" class="clock-container hidden">
        <span class="material-symbols-outlined" style="margin-right: 0.5rem;">timer</span>
        <span id="clock-value" class="clock-value">00:00</span>
      </div>

      <!-- CONTENIDO DEL JUEGO -->
      <div id="game-content" class="flex-1 flex flex-col items-center justify-center">
        
        <!-- Estado inicial -->
        <div id="waiting-state" class="text-center">
          <h1 style="font-family: 'Bangers', cursive; font-size: 3rem; color: #1c1b1b;">🎨 PICTIONARY 🎨</h1>
          <p style="color: #5d3f3e; font-size: 1.1rem;">¡Dibuja y adivina!</p>
          <p style="color: #5d3f3e; font-size: 0.9rem; margin-top: 0.5rem;">Esperando que el conductor inicie el juego...</p>
        </div>

        <!-- Zona de dibujo (oculta al inicio) -->
        <div id="drawing-container" class="hidden w-full">
          
          <!-- Header del dibujo -->
          <div class="drawing-header">
            <div class="turn-indicator" id="turn-indicator">
              <span class="turn-dot"></span>
              <span id="turn-text">TURNO: EQUIPO A</span>
            </div>
            <div class="word-display">
              <span class="word-badge">PALABRA:</span>
              <span id="current-word" class="word-text">???</span>
            </div>
          </div>

          <!-- Canvas de dibujo -->
          <div class="canvas-wrapper">
            <canvas id="drawing-canvas" class="drawing-canvas"></canvas>
            
            <!-- Herramientas -->
            <div class="tools-bar">
              <div class="color-picker">
                <button class="color-btn active" data-color="#1c1b1b" style="background: #1c1b1b;"></button>
                <button class="color-btn" data-color="#ba1a1a" style="background: #ba1a1a;"></button>
                <button class="color-btn" data-color="#008562" style="background: #008562;"></button>
                <button class="color-btn" data-color="#0050a0" style="background: #0050a0;"></button>
                <button class="color-btn" data-color="#ffc72c" style="background: #ffc72c;"></button>
              </div>
              <div class="size-picker">
                <button class="size-btn" data-size="3">
                  <span class="size-dot" style="width: 6px; height: 6px;"></span>
                </button>
                <button class="size-btn active" data-size="5">
                  <span class="size-dot" style="width: 10px; height: 10px;"></span>
                </button>
                <button class="size-btn" data-size="10">
                  <span class="size-dot" style="width: 16px; height: 16px;"></span>
                </button>
              </div>
              <button id="btn-undo" class="tool-btn">
                <span class="material-symbols-outlined">undo</span>
              </button>
              <button id="btn-clear" class="tool-btn danger">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </div>

          <!-- Botones de control del turno -->
          <div class="turn-controls">
            <button id="btn-correct" class="btn-correct">
              <span class="material-symbols-outlined">check_circle</span>
              ¡CORRECTO! +100
            </button>
            <button id="btn-pass" class="btn-pass">
              <span class="material-symbols-outlined">skip_next</span>
              PASAR
            </button>
          </div>

        </div>

      </div>

    </section>

    <!-- AREA CONDUCTOR (4 columnas) -->
    <aside id="conductor-area" class="conductor-area">
      <div class="conductor-panel">
        
        <!-- Título -->
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h3 style="font-family: 'Bangers', cursive; font-size: 1.5rem; color: #1c1b1b;">PANEL DEL CONDUCTOR</h3>
          <p style="font-size: 0.75rem; color: #5d3f3e;">Pictionary - ¡Dibuja y adivina!</p>
        </div>

        <!-- BOTÓN EMPECEMOS -->
        <button id="btn-start" class="btn-primary" style="width: 100%; margin-bottom: 1rem;">
          <span class="material-symbols-outlined" style="margin-right: 0.5rem;">play_arrow</span>
          EMPECEMOS
        </button>

        <!-- PALABRA ACTUAL -->
        <div class="solution-box">
          <div class="solution-header">
            <span class="material-symbols-outlined" style="font-size: 1rem;">key</span>
            <span>Palabra a Dibujar</span>
          </div>
          <div class="solution-content">
            <span id="official-word">CARGANDO...</span>
            <span class="solution-badge">Oficial</span>
          </div>
        </div>

        <!-- SELECTOR EQUIPO -->
        <div style="margin-bottom: 1rem;">
          <label class="select-label">Equipo que Dibuja</label>
          <div class="team-selector">
            <button class="team-btn active" data-team="A">EQUIPO A</button>
            <button class="team-btn" data-team="B">EQUIPO B</button>
          </div>
        </div>

        <!-- SELECTORES -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
          <div class="select-container">
            <label class="select-label">Rondas</label>
            <select id="rounds-select" class="select-input">
              <option value="3">3 Rondas</option>
              <option value="5" selected>5 Rondas</option>
              <option value="7">7 Rondas</option>
            </select>
          </div>
          <div class="select-container">
            <label class="select-label">Tiempo/Ronda</label>
            <select id="time-select" class="select-input">
              <option value="60">60 seg</option>
              <option value="90" selected>90 seg</option>
              <option value="120">120 seg</option>
            </select>
          </div>
        </div>

        <!-- CONTROLES -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
          <button id="btn-pause" class="btn-secondary" style="width: 100%;">
            <span class="material-symbols-outlined" style="font-size: 1rem;">pause</span> PAUSAR
          </button>
          <button id="btn-end" class="btn-danger" style="width: 100%;">
            <span class="material-symbols-outlined" style="font-size: 1rem;">stop</span> TERMINAR
          </button>
        </div>

        <!-- SIGUIENTE PALABRA -->
        <button id="btn-next-word" class="btn-secondary" style="width: 100%; margin-bottom: 1rem;">
          <span class="material-symbols-outlined" style="font-size: 1rem;">skip_next</span> SIGUIENTE PALABRA
        </button>

        <!-- SECCIÓN PALABRAS -->
        <div class="questions-section">
          <button id="btn-toggle-questions" class="questions-toggle">
            <span class="material-symbols-outlined">text_fields</span>
            PALABRAS
          </button>
          <div id="questions-panel" class="questions-panel hidden">
            <div id="questions-list"></div>
            <button id="btn-add-word" class="btn-secondary" style="width: 100%; margin-top: 0.5rem;">
              + AGREGAR PALABRA
            </button>
          </div>
        </div>

      </div>
    </aside>

  </div>

  <!-- MODAL EDITAR PALABRA -->
  <div id="edit-word-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="font-family: 'Bangers', cursive; font-size: 1.5rem; margin-bottom: 1rem;">EDITAR PALABRA</h3>
      <input type="hidden" id="edit-word-index" value="-1">
      <div style="margin-bottom: 1rem;">
        <label class="select-label">Palabra o frase</label>
        <input type="text" id="edit-word-text" class="select-input" style="width: 100%;" placeholder="Escribe la palabra...">
      </div>
      <div style="margin-bottom: 1rem;">
        <label class="select-label">Categoría (opcional)</label>
        <input type="text" id="edit-word-category" class="select-input" style="width: 100%;" placeholder="Ej: Animales, Comida, etc.">
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button id="btn-save-word" class="btn-primary" style="flex: 1;">GUARDAR</button>
        <button id="btn-cancel-word" class="btn-secondary" style="flex: 1;">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="../_shared/game-sdk.js"></script>
  <script src="../_shared/game-start-modal.js"></script>
  <script src="game.js"></script>

</body>
</html>
