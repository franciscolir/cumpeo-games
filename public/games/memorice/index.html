<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorice - CUMPEO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="../_shared/game-styles.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-surface">

  <!-- MODALES -->
  <div id="start-modal" class="hidden"></div>
  <div id="pause-modal" class="hidden"></div>
  <div id="turn-modal" class="hidden"></div>
  <div id="end-modal" class="hidden"></div>
  <div id="results-modal" class="hidden"></div>

  <div class="game-layout">

    <!-- CONFIG VIEW (full-screen, oculto al inicio) -->
    <div id="config-view" class="config-view">
      <div class="config-view-header">
        <h2>⚙️ CONFIGURACIÓN</h2>
        <button id="btn-close-config" class="config-close-btn">✕ CERRAR</button>
      </div>
      <div class="config-view-body">
        <div class="config-section">
          <div class="config-section-title">Tiempo y Rondas</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="select-container">
              <label class="select-label">Tiempo/Turno</label>
              <select id="time-select" class="select-input">
                <option value="15">15 seg</option>
                <option value="30" selected>30 seg</option>
                <option value="45">45 seg</option>
                <option value="60">60 seg</option>
              </select>
            </div>
            <div class="select-container">
              <label class="select-label">Rondas</label>
              <select id="rounds-select" class="select-input">
                <option value="2">2 Rondas</option>
                <option value="3" selected>3 Rondas</option>
                <option value="4">4 Rondas</option>
              </select>
            </div>
          </div>
        </div>
        <div class="config-section">
          <div class="config-section-title">Puntaje</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="select-container">
              <label class="select-label">Puntos por par</label>
              <select id="config-correct-points" class="select-input">
                <option value="25">25 pts</option>
                <option value="50" selected>50 pts</option>
                <option value="100">100 pts</option>
                <option value="150">150 pts</option>
                <option value="200">200 pts</option>
              </select>
            </div>
            <div class="select-container">
              <label class="select-label">Penalización</label>
              <div style="display:flex; align-items:center; gap:0.75rem; margin-top:0.25rem;">
                <input type="checkbox" id="config-penalty-toggle" style="width:1.2rem; height:1.2rem; cursor:pointer;">
                <label for="config-penalty-toggle" style="font-size:0.85rem; cursor:pointer;">Restar por incorrecta</label>
              </div>
              <select id="config-penalty-points" class="select-input" style="margin-top:0.5rem;">
                <option value="10">-10 pts</option>
                <option value="25" selected>-25 pts</option>
                <option value="50">-50 pts</option>
                <option value="100">-100 pts</option>
              </select>
            </div>
          </div>
        </div>
        <div class="config-section">
          <div class="config-section-title">Imágenes</div>
          <div id="questions-list"></div>
        </div>
      </div>
    </div>

    <!-- AREA DE JUEGO (8 columnas) -->
    <section id="game-area" class="game-area">
      
      <!-- TIMER ROW -->
      <div id="timer-row" class="timer-row hidden">
        <div class="clock-container">
          <span class="material-symbols-outlined" style="margin-right:0.25rem;">timer</span>
          <span id="clock-value" class="clock-value">00:00</span>
        </div>
        <div class="timer-bar-wrapper">
          <span class="timer-dynamite">💣</span>
          <div id="timer-bar-fill" class="timer-bar-fill" style="width:100%"></div>
        </div>
        <div class="timer-scoreboard">
          <span class="score-badge team-a">🔴 <span id="score-a">0</span></span>
          <span class="score-badge team-b">🟡 <span id="score-b">0</span></span>
        </div>
      </div>

      <!-- CONTENIDO DEL JUEGO -->
      <div id="game-content" class="flex-1 flex flex-col items-center justify-center">
        
        <!-- Estado inicial -->
        <div id="waiting-state" class="text-center">
          <h1 style="font-family: 'Bangers', cursive; font-size: 3rem; color: #1c1b1b;">🧠 MEMORICE 🧠</h1>
          <p style="color: #5d3f3e; font-size: 1.1rem;">Encuentra los pares de cartas iguales</p>
          <p style="color: #5d3f3e; font-size: 0.9rem; margin-top: 0.5rem;">Esperando que el conductor inicie el juego...</p>
        </div>

        <!-- Tablero (oculto al inicio) -->
        <div id="board-container" class="hidden w-full">
          
          <!-- Header del tablero -->
          <div class="board-header">
            <div class="turn-indicator" id="turn-indicator">
              <span class="turn-dot"></span>
              <span id="turn-text">TURNO: EQUIPO A</span>
            </div>
            <div class="score-display">
              <span class="score-badge team-a">🔴 <span id="score-a">0</span> PTS</span>
              <span class="score-badge team-b">🟡 <span id="score-b">0</span> PTS</span>
            </div>
          </div>

          <!-- Grid de cartas -->
          <div id="cards-grid" class="cards-grid"></div>

          <!-- Info de turno -->
          <div id="turn-info" class="turn-info hidden">
            <span id="turn-info-text">Turno del Equipo A</span>
          </div>

        </div>

      </div>

    </section>

    <!-- AREA CONDUCTOR (4 columnas) -->
    <aside id="conductor-area" class="conductor-area">
      <div class="conductor-panel">

        <!-- SELECTOR EQUIPO -->
        <div style="margin-bottom: 1rem;">
          <label class="select-label">Equipo Activo</label>
          <div class="team-selector btn-disabled">
            <button class="team-btn active" data-team="A">EQUIPO A</button>
            <button class="team-btn" data-team="B">EQUIPO B</button>
          </div>
        </div>

        <!-- CONTROLES -->
        <div class="btn-disabled" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
          <button id="btn-pause" class="btn-secondary" style="width: 100%;">
            <span class="material-symbols-outlined" style="font-size: 1rem;">pause</span> PAUSAR
          </button>
          <button id="btn-end" class="btn-danger" style="width: 100%;">
            <span class="material-symbols-outlined" style="font-size: 1rem;">stop</span> TERMINAR
          </button>
        </div>

        <!-- REINICIAR -->
        <button id="btn-reset" class="btn-secondary btn-disabled" style="width: 100%; margin-bottom: 1rem;">
          <span class="material-symbols-outlined" style="font-size: 1rem;">refresh</span> REINICIAR TABLERO
        </button>

        <!-- BOTÓN EMPECEMOS -->
        <button id="btn-start" class="btn-primary" style="width: 100%; margin-bottom: 1rem;">
          <span class="material-symbols-outlined" style="margin-right: 0.5rem;">play_arrow</span>
          EMPECEMOS
        </button>

        <!-- BOTÓN CONFIGURAR -->
        <button id="btn-config" class="btn-config" style="width:100%;">
          <span class="material-symbols-outlined" style="font-size:1rem;">settings</span> CONFIGURAR
        </button>

      </div>
    </aside>

  </div>

  <!-- MODAL EDITAR IMÁGENES -->
  <div id="edit-image-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="font-family: 'Bangers', cursive; font-size: 1.5rem; margin-bottom: 1rem;">SET DE IMÁGENES</h3>
      <input type="hidden" id="edit-set-index" value="-1">
      <div style="margin-bottom: 1rem;">
        <label class="select-label">Nombre del Set</label>
        <input type="text" id="edit-set-name" class="select-input" style="width: 100%;" placeholder="Ej: Animales, Comida, etc.">
      </div>
      <div style="margin-bottom: 1rem;">
        <label class="select-label">Emojis (separados por coma, mínimo 8)</label>
        <textarea id="edit-set-emojis" class="select-input" style="width: 100%; min-height: 100px;" placeholder="🐶, 🐱, 🐭, 🐹, 🐰, 🦊, 🐻, 🐼"></textarea>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button id="btn-save-image" class="btn-primary" style="flex: 1;">GUARDAR</button>
        <button id="btn-cancel-image" class="btn-secondary" style="flex: 1;">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="../_shared/game-sdk.js"></script>
  <script src="../_shared/game-start-modal.js"></script>
  <script src="../_shared/game-core.js"></script>
  <script src="game.js"></script>

</body>
</html>
