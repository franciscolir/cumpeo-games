<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Relámpago - CUMPEO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="../_shared/game-styles.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-surface">

  <div class="game-layout">

    <!-- CONFIG VIEW (full-screen, oculto al inicio) -->
    <div id="config-view" class="config-view">
      <div class="config-view-header">
        <h2>⚙️ CONFIGURACIÓN</h2>
        <button id="btn-close-config" class="config-close-btn">✕ CERRAR</button>
      </div>
      <div class="config-view-body">
        <div class="config-section">
          <div class="config-section-title">Tiempo y Rondas</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="select-container">
              <label class="select-label">Tiempo/Pregunta</label>
              <select id="time-select" class="select-input">
                <option value="10">10 seg</option>
                <option value="15" selected>15 seg</option>
                <option value="20">20 seg</option>
                <option value="30">30 seg</option>
              </select>
            </div>
            <div class="select-container">
              <label class="select-label">Rondas</label>
              <select id="rounds-select" class="select-input">
                <option value="3">3 Rondas</option>
                <option value="5" selected>5 Rondas</option>
                <option value="7">7 Rondas</option>
                <option value="10">10 Rondas</option>
              </select>
            </div>
          </div>
        </div>
        <div class="config-section">
          <div class="config-section-title">Puntaje</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="select-container">
              <label class="select-label">Puntos por correcta</label>
              <select id="config-correct-points" class="select-input">
                <option value="25">25 pts</option>
                <option value="50" selected>50 pts</option>
                <option value="100">100 pts</option>
                <option value="150">150 pts</option>
                <option value="200">200 pts</option>
              </select>
            </div>
            <div class="select-container">
              <label class="select-label">Penalización</label>
              <div style="display:flex; align-items:center; gap:0.75rem; margin-top:0.25rem;">
                <input type="checkbox" id="config-penalty-toggle" style="width:1.2rem; height:1.2rem; cursor:pointer;">
                <label for="config-penalty-toggle" style="font-size:0.85rem; cursor:pointer;">Restar por incorrecta</label>
              </div>
              <select id="config-penalty-points" class="select-input" style="margin-top:0.5rem;">
                <option value="10">-10 pts</option>
                <option value="25" selected>-25 pts</option>
                <option value="50">-50 pts</option>
                <option value="100">-100 pts</option>
              </select>
            </div>
          </div>
        </div>
        <div class="config-section">
          <div class="config-section-title">Preguntas</div>
          <div id="questions-list"></div>
          <button id="btn-add-question" class="btn-secondary" style="width:100%; margin-top:0.5rem;">
            + AGREGAR PREGUNTA
          </button>
        </div>
      </div>
    </div>

    <!-- AREA DE JUEGO -->
    <section id="game-area" class="game-area">

      <!-- TIMER ROW -->
      <div id="timer-row" class="timer-row hidden">
        <div class="clock-container">
          <span class="material-symbols-outlined" style="margin-right:0.25rem;">timer</span>
          <span id="clock-value" class="clock-value">00:00</span>
        </div>
        <div class="timer-bar-wrapper">
          <span class="timer-dynamite">💣</span>
          <div id="timer-bar-fill" class="timer-bar-fill" style="width:100%"></div>
        </div>
        <div class="timer-scoreboard">
          <span class="score-badge team-a">🔴 <span id="score-a">0</span></span>
          <span class="score-badge team-b">🟡 <span id="score-b">0</span></span>
        </div>
      </div>

      <!-- CONTENIDO DEL JUEGO -->
      <div id="game-content" class="flex-1 flex flex-col items-center justify-center">

        <!-- Estado inicial -->
        <div id="waiting-state" class="text-center">
          <h1 style="font-family:'Bangers',cursive; font-size:3rem; color:#1c1b1b;">⚡ TRIVIA RELÁMPAGO ⚡</h1>
          <p style="color:#5d3f3e; font-size:1.1rem;">Esperando que el conductor inicie el juego...</p>
        </div>

        <!-- Pregunta -->
        <div id="question-container" class="hidden w-full">
          <div class="question-card">
            <h2 id="question-text" class="question-text">¿Cargando pregunta...</h2>
            <div id="answers-container" class="answers-grid">
              <button class="answer-btn" data-index="0">
                <span class="answer-letter">A</span>
                <span class="answer-text" id="answer-0">-</span>
              </button>
              <button class="answer-btn" data-index="1">
                <span class="answer-letter">B</span>
                <span class="answer-text" id="answer-1">-</span>
              </button>
              <button class="answer-btn" data-index="2">
                <span class="answer-letter">C</span>
                <span class="answer-text" id="answer-2">-</span>
              </button>
              <button class="answer-btn" data-index="3">
                <span class="answer-letter">D</span>
                <span class="answer-text" id="answer-3">-</span>
              </button>
            </div>
          </div>
          <div id="result-container" class="hidden text-center" style="margin-top:1.5rem;">
            <div id="result-box" class="result-box">¡Correcto! +50 pts</div>
          </div>
        </div>

      </div>
    </section>

    <!-- AREA CONDUCTOR -->
    <aside id="conductor-area" class="conductor-area">
      <div class="conductor-panel">

        <!-- CONTROLES (deshabilitados hasta EMPECEMOS) -->
        <div id="game-controls" class="btn-disabled" style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
          <button id="btn-pause" class="btn-secondary">
            <span class="material-symbols-outlined" style="font-size:1rem;">pause</span> PAUSAR
          </button>
          <button id="btn-end" class="btn-danger">
            <span class="material-symbols-outlined" style="font-size:1rem;">stop</span> TERMINAR
          </button>
        </div>

        <!-- PUNTOS EXTRA (deshabilitados) -->
        <div id="extra-points" class="btn-disabled">
          <label class="select-label">Puntos Extra</label>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn-secondary btn-points" data-points="25">+25</button>
            <button class="btn-secondary btn-points" data-points="50">+50</button>
            <button class="btn-secondary btn-points" data-points="100">+100</button>
          </div>
        </div>

        <!-- SIGUIENTE (deshabilitado) -->
        <button id="btn-next" class="btn-secondary btn-disabled" style="width:100%;">
          <span class="material-symbols-outlined" style="font-size:1rem;">skip_next</span> SIGUIENTE
        </button>

        <!-- BOTÓN EMPECEMOS -->
        <button id="btn-start" class="btn-primary" style="width:100%;">
          <span class="material-symbols-outlined" style="font-size:1rem;">play_arrow</span> EMPECEMOS
        </button>

        <!-- BOTÓN CONFIGURAR (siempre habilitado, abajo, gris) -->
        <button id="btn-config" class="btn-config" style="width:100%;">
          <span class="material-symbols-outlined" style="font-size:1rem;">settings</span> CONFIGURAR
        </button>

      </div>
    </aside>

  </div>

  <!-- MODAL EDITAR PREGUNTA -->
  <div id="edit-question-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="font-family:'Bangers',cursive; font-size:1.5rem; margin-bottom:1rem;">EDITAR PREGUNTA</h3>
      <input type="hidden" id="edit-question-index" value="-1">
      <div style="margin-bottom:1rem;">
        <label class="select-label">Pregunta</label>
        <input type="text" id="edit-question-text" class="select-input" style="width:100%;" placeholder="Escribe la pregunta...">
      </div>
      <div style="margin-bottom:1rem;">
        <label class="select-label">Respuesta Correcta</label>
        <input type="text" id="edit-answer-correct" class="select-input" style="width:100%;" placeholder="Respuesta correcta">
      </div>
      <div style="margin-bottom:1rem;">
        <label class="select-label">Opción Incorrecta 1</label>
        <input type="text" id="edit-answer-wrong1" class="select-input" style="width:100%;" placeholder="Opción incorrecta">
      </div>
      <div style="margin-bottom:1rem;">
        <label class="select-label">Opción Incorrecta 2</label>
        <input type="text" id="edit-answer-wrong2" class="select-input" style="width:100%;" placeholder="Opción incorrecta">
      </div>
      <div style="margin-bottom:1rem;">
        <label class="select-label">Opción Incorrecta 3</label>
        <input type="text" id="edit-answer-wrong3" class="select-input" style="width:100%;" placeholder="Opción incorrecta">
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button id="btn-save-question" class="btn-primary" style="flex:1;">GUARDAR</button>
        <button id="btn-cancel-question" class="btn-secondary" style="flex:1;">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="../_shared/game-sdk.js"></script>
  <script src="../_shared/game-start-modal.js"></script>
  <script src="../_shared/game-core.js"></script>
  <script src="game.js"></script>

</body>
</html>
