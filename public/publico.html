<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Público</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<h1>En Vivo</h1>
<div id="view">Cargando...</div>
<script type="module">
import { db } from './js/db.js';
const view = document.getElementById('view');
async function render() {
  const state = await db.getState();
  if (state.current_game) {
    view.innerHTML = `<h2>${state.current_game.name}</h2><p>${state.current_game.description||''}</p><p>Estado: ${state.status}</p>`;
  } else {
    view.textContent = 'Sin juego activo';
  }
}
setInterval(render, 2000);
render();
</script>
</body>
</html>
