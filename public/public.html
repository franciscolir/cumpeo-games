<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <title>Cumpeo Games - Público</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#bb0024",secondary:"#775a00",tertiary:"#00694d",surface:"#fcf9f8"}}}}</script>
  <style>
    @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}
    ::-webkit-scrollbar{display:none;}
    .comic-shadow-sm{box-shadow:2px 2px 0px #1c1b1b;}
    .comic-shadow-md{box-shadow:3px 3px 0px #1c1b1b;}
    .comic-shadow-lg{box-shadow:4px 4px 0px #1c1b1b;}
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
  <div class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-primary-container via-secondary-container to-tertiary-fixed">
    <div class="w-full max-w-6xl">
      <!-- Header -->
      <div class="text-center mb-12">
        <h1 class="text-6xl md:text-8xl font-black text-on-surface mb-4 tracking-wider animate-pulse">CUMPEO</h1>
        <p class="text-2xl text-on-surface-variant">Vista Pública - Sala CMP-770</p>
      </div>

      <!-- Main Game Display -->
      <div class="bg-surface-container-lowest border-4 border-on-surface rounded-3xl p-12 comic-shadow-lg text-center">
        <div id="game-header" class="mb-8">
          <h2 id="game-name" class="text-5xl md:text-7xl font-black text-on-surface mb-4">Esperando juego...</h2>
          <p id="game-status" class="text-3xl text-on-surface-variant">Conductor preparando partida</p>
        </div>

        <!-- Game Content Area -->
        <div id="game-content" class="min-h-[300px] flex items-center justify-center">
          <div class="text-on-surface-variant text-2xl">
            <span class="material-symbols-outlined text-6xl mb-4">hourglass_empty</span>
            <p>En espera del conductor</p>
          </div>
        </div>

        <!-- Stats Bar -->
        <div id="stats-bar" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
          <div class="bg-surface-container-low border-2 border-on-surface rounded-2xl p-6">
            <p class="text-sm text-on-surface-variant uppercase tracking-wider">Ronda</p>
            <p id="round-display" class="text-5xl font-black text-on-surface">--</p>
          </div>
          <div class="bg-surface-container-low border-2 border-on-surface rounded-2xl p-6">
            <p class="text-sm text-on-surface-variant uppercase tracking-wider">Puntuación</p>
            <p id="score-display" class="text-5xl font-black text-on-surface">--</p>
          </div>
          <div class="bg-surface-container-low border-2 border-on-surface rounded-2xl p-6">
            <p class="text-sm text-on-surface-variant uppercase tracking-wider">Tiempo</p>
            <p id="timer-display" class="text-5xl font-black text-on-surface">00:00</p>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-8 text-on-surface-variant">
        <p class="text-lg">Código de sala: <span class="font-mono font-bold text-2xl text-on-surface">CMP-770</span></p>
        <p>Esta pantalla se actualiza automáticamente</p>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';
    let gameState = null;
    let updateInterval = null;

    async function loadGameState() {
      try {
        const res = await fetch(`${API}/state`);
        const state = await res.json();
        gameState = state;
        renderGame(state);
      } catch (err) {
        console.error('Error loading game state:', err);
      }
    }

    function renderGame(state) {
      const gameNameEl = document.getElementById('game-name');
      const gameStatusEl = document.getElementById('game-status');
      const gameContentEl = document.getElementById('game-content');
      const roundDisplay = document.getElementById('round-display');
      const scoreDisplay = document.getElementById('score-display');
      const timerDisplay = document.getElementById('timer-display');

      if (!state.current_game && state.status === 'idle') {
        gameNameEl.textContent = 'Esperando juego...';
        gameStatusEl.textContent = 'Conductor preparando partida';
        gameContentEl.innerHTML = `
          <div class="text-on-surface-variant text-2xl">
            <span class="material-symbols-outlined text-6xl mb-4">hourglass_empty</span>
            <p>En espera del conductor</p>
          </div>
        `;
        roundDisplay.textContent = '--';
        scoreDisplay.textContent = '--';
        timerDisplay.textContent = '00:00';
        return;
      }

      if (state.current_game) {
        gameNameEl.textContent = state.current_game.name || 'Juego en progreso';
        gameStatusEl.textContent = `Estado: ${state.status}`;
        
        // Render game-specific content
        if (state.status === 'active') {
          gameContentEl.innerHTML = `
            <div id="trivia-content" class="w-full">
              <p class="text-3xl mb-6">Pregunta ${state.current_game_id || 1}</p>
              <p class="text-4xl font-bold">¿Cuál es el juego favorito?</p>
            </div>
          `;
        } else if (state.status === 'paused') {
          gameContentEl.innerHTML = `
            <div class="text-center">
              <span class="material-symbols-outlined text-8xl mb-4">pause</span>
              <p class="text-3xl">Partida pausada</p>
            </div>
          `;
        }

        roundDisplay.textContent = state.current_game_id || '--';
        scoreDisplay.textContent = Math.floor(Math.random() * 1000);
        timerDisplay.textContent = new Date().toLocaleTimeString('es-CL', {minute: '2-digit', second: '2-digit'});
      }
    }

    // Poll every 2 seconds
    updateInterval = setInterval(loadGameState, 2000);
    
    // Initial load
    loadGameState();

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (updateInterval) clearInterval(updateInterval);
    });
  </script>
</body>
</html>
